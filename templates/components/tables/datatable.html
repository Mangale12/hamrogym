{# Apps/datatables/templates/datatables/base.html #}
{% load static %}

<div class="datatable-container">
    <table id="{{ table_id|default:'dataTable' }}"
           class="table table-striped table-bordered datatable"
           style="width:100%">
        <thead>
            <tr>
                {% if show_sno != False %}
                <th>S. No.</th>
                {% endif %}
                {% for column in columns %}
                <th>{{ column.title|default:column.name }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {# Data will be loaded via AJAX #}
        </tbody>
    </table>
</div>

{% block datatable_scripts %}
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">

<script>
$(document).ready(function() {
    const tableInstance = $('#{{ table_id|default:"dataTable" }}').DataTable({
        processing: true,
        serverSide: true,
        ajax: {
            url: "{{ ajax_url }}",
            cache: false
        },
        columns: [
            {% if show_sno != False %}
            {
                data: "__sno__",
                title: "S. No.",
                orderable: false,
                searchable: false,
                render: function (data, type, row, meta) {
                    return meta.row + meta.settings._iDisplayStart + 1;
                }
            },
            {% endif %}
            {% for column in columns %}
            {
                data: "{{ column.name }}",
                title: "{{ column.title|default:column.name }}",
                {% if column.orderable is False %}orderable: false,{% endif %}
                {% if column.searchable is False %}searchable: false,{% endif %}
                {% if column.render %}render: {{ column.render|safe }},{% endif %}
            },
            {% endfor %}
        ],
        pageLength: {{ page_length|default:10 }},
        language: {
            processing: "Loading...",
            search: "Search:",
            lengthMenu: "Show _MENU_ entries",
            info: "Showing _START_ to _END_ of _TOTAL_ entries",
            paginate: {
                first: "First",
                last: "Last",
                next: "Next",
                previous: "Previous"
            }
        }
    });

    {% if table_var %}
    window.{{ table_var }} = tableInstance;
    {% endif %}
});
</script>
{% endblock %}
