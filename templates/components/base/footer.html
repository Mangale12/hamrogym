 <!-- New Booking Modal -->
  {% load static %}
 <div class="modal fade" id="newBookingModal" tabindex="-1" aria-labelledby="newBookingModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="newBookingModalLabel"><i data-feather="plus-circle"></i> Create New Booking</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="bookingForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="guestName" class="form-label">Guest Name</label>
                            <input type="text" class="form-control" id="guestName" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="guestEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="guestEmail" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="checkInDate" class="form-label">Check-in Date</label>
                            <input type="date" class="form-control" id="checkInDate" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="checkOutDate" class="form-label">Check-out Date</label>
                            <input type="date" class="form-control" id="checkOutDate" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="roomType" class="form-label">Room Type</label>
                            <select class="form-select" id="roomType" required>
                                <option value="">Select room type</option>
                                <option value="standard">Standard Room</option>
                                <option value="deluxe">Deluxe Suite</option>
                                <option value="executive">Executive Suite</option>
                                <option value="family">Family Suite</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="guests" class="form-label">Number of Guests</label>
                            <select class="form-select" id="guests" required>
                                <option value="1">1 Guest</option>
                                <option value="2">2 Guests</option>
                                <option value="3">3 Guests</option>
                                <option value="4">4 Guests</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="specialRequests" class="form-label">Special Requests</label>
                        <textarea class="form-control" id="specialRequests" rows="3"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveBookingBtn">Create Booking</button>
            </div>
        </div>
    </div>
</div>


<!-- Bootstrap JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script src="{% static 'js/dynamic-sections.js' %}"></script>
<!-- Custom JavaScript -->
<script>
    (function () {
        function replaceFeatherIcons() {
            if (window.feather) {
                feather.replace({ 'aria-hidden': 'true' });
            }
        }
    
        // Initial page load
        document.addEventListener('DOMContentLoaded', replaceFeatherIcons);
    
        // After full page load
        window.addEventListener('load', replaceFeatherIcons);
    
        // Observe DOM changes (AJAX, modal, dynamic content)
        const observer = new MutationObserver(function (mutations) {
            mutations.forEach(function (mutation) {
                if (mutation.addedNodes.length) {
                    replaceFeatherIcons();
                }
            });
        });
    
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    
        // Optional: expose globally if needed
        window.refreshFeatherIcons = replaceFeatherIcons;
    })();

    $(document).on('click', '.edit-btn', function() {
        const url = $(this).data('url');          // e.g. "/room-view-types/5/"
        const modalSelector = $(this).data('bs-target'); // e.g. "#roomViewTypeModal"
        const id = $(this).data('id');
        const title = $(this).data('title');
        $.ajax({
            url: url.replace('{id}', id),
            method: 'GET',
            success: function(data) {
                const $modal = $(modalSelector);

                // Set modal title to "Edit ..."
                $modal.find('.modal-title').text(title);

                // 🔑 Auto-fill form fields by name
                for (const [key, value] of Object.entries(data.data)) {
                    const $field = $modal.find(`[name="${key}"]`);
                    if ($field.length) {
                        if ($field.is(':checkbox')) {
                            $field.prop('checked', !!value);
                        } else {
                            $field.val(value || '');
                        }
                    }
                }

                // Show modal
                $modal.modal('show');

                // Fix Feather icons inside modal (optional)
                $modal.on('shown.bs.modal', function() {
                    feather.replace();
                });
            },
            error: function() {
                alert('Failed to load record.');
            }
        });
    });


    // Initialize Select2 for modals when they open
    $(document).on('shown.bs.modal', '.modal', function () {
        const $modal = $(this);
        const modalId = $modal.attr('id');

        // Find all select fields inside this modal that have a data-url
        $modal.find('select[data-url]').each(function () {
            const $select = $(this);
            const url = $select.data('url');
            console.log(url);
            const fieldName = $select.data('field-name');

            // Destroy if already initialized (prevent duplicates)
            if ($select.data('select2')) {
                $select.select2('destroy');
            }

            // Initialize Select2 with AJAX
            $select.select2({
                theme: 'bootstrap-5',
                width: '100%',
                placeholder: `Select ${fieldName}`,
                allowClear: !($select.prop('required')),
                ajax: {
                    url: url,
                    dataType: 'json',
                    delay: 250,
                    data: function (params) {
                        return {
                            q: params.term, // search term
                            page: params.page || 1
                        };
                    },
                    processResults: function (data, params) {
                        // Normalize response
                        // Expected format: { results: [{ id: 1, text: "Name" }, ...] }
                        return {
                            results: data.results || data,
                            pagination: {
                                more: (params.page || 1) < (data.pagination?.total_pages || 1)
                            }
                        };
                    },
                    cache: true
                },
                minimumInputLength: 0,
                // Optional: Load initial options when opened (if needed)
                // But usually not needed for create forms
            });

            // If editing, hydrate the selected value so Select2 shows it.
            const currentValue = $select.val();
            if (currentValue) {
                const values = Array.isArray(currentValue) ? currentValue : [currentValue];
                const missing = values.filter(
                    (val) => $select.find(`option[value="${val}"]`).length === 0
                );
                if (missing.length) {
                    $.get(url, { ids: missing.join(',') })
                        .done(function (res) {
                            const results = res && res.results ? res.results : [];
                            results.forEach((item) => {
                                const option = new Option(item.text, item.id, true, true);
                                $select.append(option);
                            });
                            $select.trigger('change');
                        })
                        .fail(function () {
                            // silently ignore hydration failures
                        });
                }
            }
        });
    });
    </script>

    
</body>
</html>
