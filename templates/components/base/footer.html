 <!-- New Booking Modal -->
  {% load static %}
 <div class="modal fade" id="newBookingModal" tabindex="-1" aria-labelledby="newBookingModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="newBookingModalLabel"><i data-feather="plus-circle"></i> Create New Booking</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="bookingForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="guestName" class="form-label">Guest Name</label>
                            <input type="text" class="form-control" id="guestName" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="guestEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="guestEmail" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="checkInDate" class="form-label">Check-in Date</label>
                            <input type="date" class="form-control" id="checkInDate" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="checkOutDate" class="form-label">Check-out Date</label>
                            <input type="date" class="form-control" id="checkOutDate" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="roomType" class="form-label">Room Type</label>
                            <select class="form-select" id="roomType" required>
                                <option value="">Select room type</option>
                                <option value="standard">Standard Room</option>
                                <option value="deluxe">Deluxe Suite</option>
                                <option value="executive">Executive Suite</option>
                                <option value="family">Family Suite</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="guests" class="form-label">Number of Guests</label>
                            <select class="form-select" id="guests" required>
                                <option value="1">1 Guest</option>
                                <option value="2">2 Guests</option>
                                <option value="3">3 Guests</option>
                                <option value="4">4 Guests</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="specialRequests" class="form-label">Special Requests</label>
                        <textarea class="form-control" id="specialRequests" rows="3"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveBookingBtn">Create Booking</button>
            </div>
        </div>
    </div>
</div>


<!-- Bootstrap JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script src="{% static 'js/dynamic-sections.js' %}"></script>
<!-- Custom JavaScript -->
<script>
    (function () {
        function replaceFeatherIcons() {
            if (window.feather) {
                feather.replace({ 'aria-hidden': 'true' });
            }
        }
    
        // Initial page load
        document.addEventListener('DOMContentLoaded', replaceFeatherIcons);
    
        // After full page load
        window.addEventListener('load', replaceFeatherIcons);
    
        // Observe DOM changes (AJAX, modal, dynamic content)
        const observer = new MutationObserver(function (mutations) {
            mutations.forEach(function (mutation) {
                if (mutation.addedNodes.length) {
                    replaceFeatherIcons();
                }
            });
        });
    
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    
        // Optional: expose globally if needed
        window.refreshFeatherIcons = replaceFeatherIcons;
    })();

    window.initializeModalSelect2 = function ($scope) {
        const $container = $scope && $scope.length ? $scope : $(document);

        $container.find('select[data-url]').each(function () {
            const $select = $(this);
            const url = $select.data('url');
            const fieldName = $select.data('field-name') || '';
            const $modal = $select.closest('.modal');

            if (!url) {
                return;
            }

            if (!$select.data('select2')) {
                $select.select2({
                    theme: 'bootstrap-5',
                    width: '100%',
                    placeholder: fieldName ? `Select ${fieldName}` : 'Select option',
                    allowClear: !($select.prop('required')),
                    dropdownParent: $modal.length ? $modal : undefined,
                    ajax: {
                        url: url,
                        dataType: 'json',
                        delay: 250,
                        data: function (params) {
                            return {
                                q: params.term,
                                page: params.page || 1
                            };
                        },
                        processResults: function (data, params) {
                            return {
                                results: data.results || data,
                                pagination: {
                                    more: (params.page || 1) < (data.pagination?.total_pages || 1)
                                }
                            };
                        },
                        cache: true
                    },
                    minimumInputLength: 0
                });
            }

            const pendingValues = $select.data('selectedValues');
            const pendingValue = $select.attr('data-selected-value');
            const currentValue = pendingValues || pendingValue || $select.val();
            if (!currentValue) {
                return;
            }

            const values = (Array.isArray(currentValue) ? currentValue : [currentValue]).map(
                (item) => String(item)
            );
            const missing = values.filter(
                (val) => $select.find(`option[value="${val}"]`).length === 0
            );

            if (!missing.length) {
                $select.val($select.prop('multiple') ? values : values[0]).trigger('change');
                $select.removeAttr('data-selected-value');
                $select.removeData('selectedValues');
                $select.trigger('change');
                return;
            }

            $.get(url, { ids: missing.join(',') })
                .done(function (res) {
                    const results = res && res.results ? res.results : [];
                    results.forEach((item) => {
                        const option = new Option(item.text, item.id, true, true);
                        $select.append(option);
                    });
                    $select.val($select.prop('multiple') ? values : values[0]);
                    $select.removeAttr('data-selected-value');
                    $select.removeData('selectedValues');
                    $select.trigger('change');
                });
        });
    };

    $(document).on('shown.bs.modal', '.modal', function () {
        window.initializeModalSelect2($(this));
    });
    </script>

    
</body>
</html>
