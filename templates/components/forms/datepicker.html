{% if not no_wrapper %}
<div class="mb-3 {{ wrapper_class|default:'' }}">
{% endif %}
  <label class="form-label">
    {{ label }}{% if required %} <span class="text-danger">*</span>{% endif %}
  </label>

  {% if is_bs_calendar %}
  <input type="hidden" name="__bs_date_fields" value="{{ name }}">
  <input
    type="text"
    name="{{ name }}"
    value="{{ value|default:'' }}"
    {% if id %}id="{{ id }}"{% endif %}
    class="form-control {{ class|default:'' }}"
    placeholder="{{ placeholder|default:'YYYY-MM-DD' }}"
    data-calendar-mode="bs"
    autocomplete="off"
    {% if required %}required{% endif %}
    {% if attributes %}
      {% for key, value in attributes.items %}
        {{ key }}="{{ value }}"
      {% endfor %}
    {% endif %}
  >
  {% else %}
  <input
    type="date"
    name="{{ name }}"
    value="{{ value|default:'' }}"
    {% if id %}id="{{ id }}"{% endif %}
    class="form-control {{ class|default:'' }}"
    placeholder="{{ placeholder|default:'' }}"
    {% if required %}required{% endif %}
    {% if min %}min="{{ min }}"{% endif %}
    {% if max %}max="{{ max }}"{% endif %}
    {% if step %}step="{{ step }}"{% endif %}
    {% if attributes %}
      {% for key, value in attributes.items %}
        {{ key }}="{{ value }}"
      {% endfor %}
    {% endif %}
  >
  {% endif %}

  {% if help %}
    <small class="text-muted">{{ help }}</small>
  {% endif %}
{% if not no_wrapper %}
</div>
{% endif %}
