{% if not no_wrapper %}
<div class="mb-3 {{ wrapper_class|default:'' }}">
{% endif %}
  <label class="form-label">
    {{ label }}{% if required %} <span class="text-danger">*</span>{% endif %}
  </label>

  <select
    name="{{ name }}"
    {% if id %}id="{{ id }}"{% endif %}
    class="form-select {{ class|default:'' }}"
    {% if data_field_name %}data-field-name="{{ data_field_name }}"{% endif %}
    {% if data_url %}data-url="{{ data_url }}"{% endif %}
    {% if data_url and value and not multiple %}data-selected-value="{{ value }}"{% endif %}
    {% if data_modal_id %}data-modal-id="{{ data_modal_id }}"{% endif %}
    {% if required %}required{% endif %}
    {% if multiple %}multiple{% endif %}
    {% if attributes %}
      {% for key, value in attributes.items %}
        {{ key }}="{{ value }}"
      {% endfor %}
    {% endif %}
  >
    <option value="">{{ empty_label|default:"Select" }}{% if label %} {{ label }}{% endif %}</option>
    {% if options and not data_url %}
      {% for option in options %}
        {% if option.0 is not None %}
          <option value="{{ option.0 }}" {% if value == option.0 %}selected{% endif %}>{{ option.1 }}</option>
        {% else %}
          <option value="{{ option.value }}" {% if value == option.value %}selected{% endif %}>{{ option.label }}</option>
        {% endif %}
      {% endfor %}
    {% endif %}
  </select>

  {% if help %}
    <small class="text-muted">{{ help }}</small>
  {% endif %}
  {% if errors %}
    <div class="invalid-feedback d-block">{{ errors|join:" " }}</div>
  {% endif %}
{% if not no_wrapper %}
</div>
{% endif %}
