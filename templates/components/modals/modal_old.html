<div class="modal fade" id="{{ modal_id }}" tabindex="-1">
    <div class="modal-dialog {{ modal_size|default:'modal-lg' }}">
      <form id="{{ form_id }}" class="modal-content">
        {% csrf_token %}
        <input type="hidden" name="id"> <!-- Use generic 'id' -->
  
        <div class="modal-header">
          <h5 class="modal-title">{{ title }}</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
  
        <div class="modal-body">
          <div class="row">
            {% for field in fields %}
              <div class="col-md-{{ field.col|default:6 }} mb-3">
                {% if field.type == "textarea" %}
                  <label>{{ field.label }}{% if field.required %} <span class="text-danger">*</span>{% endif %}</label>
                  <textarea
                    class="form-control"
                    name="{{ field.name }}"
                    {% if field.required %}required{% endif %}
                  ></textarea>
  
                {% elif field.type == "checkbox" %}
                  <div class="form-check form-switch">
                    <input class="form-check-input"
                           type="checkbox"
                           name="{{ field.name }}"
                           id="{{ field.name }}"
                           {% if field.default %}checked{% endif %}>
                    <label class="form-check-label" for="{{ field.name }}">{{ field.label }}</label>
                  </div>
  
                {% else %}
                  <label>{{ field.label }}{% if field.required %} <span class="text-danger">*</span>{% endif %}</label>
                  <input
                    type="{{ field.type }}"
                    class="form-control"
                    name="{{ field.name }}"
                    {% if field.required %}required{% endif %}>
                {% endif %}
              </div>
            {% endfor %}
          </div>
        </div>
  
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
